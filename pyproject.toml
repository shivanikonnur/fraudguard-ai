[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudguard-ai"
version = "1.0.0"
description = "Educational end-to-end credit-card fraud detection ML project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "imbalanced-learn>=0.12,<1",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "streamlit>=1.35,<2",
  "joblib>=1.3,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
